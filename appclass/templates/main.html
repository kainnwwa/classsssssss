<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
</head>
<body>
    <h2>Калькулятор</h2>
    
    <form method="post">
        {% csrf_token %} 
        <p>Первое число: <input type="number" name="num1" step="any" required></p>
        <p>Второе число: <input type="number" name="num2" step="any" required></p>
        <p>
            Действие:
            <select name="operation">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
        </p>
        <button type="submit">Вычислить</button>
    </form>
    
    {% if result is not None %}
        <h3>Результат: {{ result }}</h3>
    {% endif %}
    
    {% if error %}
        <h3>{{ error }}</h3>
    {% endif %}
</body>
</html>
